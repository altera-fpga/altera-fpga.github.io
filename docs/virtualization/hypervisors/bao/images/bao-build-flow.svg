<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700">
  <title>Bao AMP example build flow</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#222"/>
    </marker>
    <style>
      .label { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .sub { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .t { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .tw { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #ffffff; }
      .ts { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #1a1a1a; }
      .src { fill: #fbd7bb; stroke: #222; stroke-width: 1; }
      .step { fill: #d7e3bf; stroke: #222; stroke-width: 1; }
      .file { fill: #b7dde8; stroke: #222; stroke-width: 1; }
      .out { fill: #7e649e; stroke: #222; stroke-width: 1; }
      .band { fill: #f7f7f7; stroke: #e2e2e2; stroke-width: 1; }
      .ln { fill: none; stroke: #222; stroke-width: 1.4; marker-end: url(#arr); }
      .legend { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #1a1a1a; }
    </style>
  </defs>

  <rect class="band" x="8" y="8" width="944" height="100" rx="8"/>
  <text class="label" x="24" y="28">Hardware Design</text>
  <rect class="src" x="24" y="40" width="250" height="56" rx="6"/>
  <text class="t" x="149" y="62" text-anchor="middle">HPS baseline enablement</text>
  <text class="ts" x="149" y="80" text-anchor="middle">baseline-a55</text>
  <line class="ln" x1="274" y1="68" x2="318" y2="68"/>
  <rect class="step" x="326" y="40" width="270" height="56" rx="6"/>
  <text class="t" x="461" y="72" text-anchor="middle">make baseline_a55-build</text>
  <line class="ln" x1="596" y1="68" x2="632" y2="68"/>
  <rect class="file" x="640" y="40" width="296" height="56" rx="6"/>
  <text class="t" x="788" y="62" text-anchor="middle">baseline_a55.sof</text>
  <text class="ts" x="788" y="80" text-anchor="middle">baseline_a55.core.rbf</text>

  <rect class="band" x="8" y="120" width="944" height="248" rx="8"/>
  <text class="label" x="24" y="142">Baremetal + Baremetal</text>
  <rect class="src" x="24" y="158" width="210" height="64" rx="6"/>
  <text class="t" x="129" y="182" text-anchor="middle">Bao, TF-A, U-Boot</text>
  <text class="ts" x="129" y="200" text-anchor="middle">and vendored guests</text>
  <line class="ln" x1="234" y1="190" x2="258" y2="190"/>
  <rect class="step" x="266" y="158" width="250" height="64" rx="6"/>
  <text class="t" x="391" y="182" text-anchor="middle">make CONFIG=baremetal</text>
  <text class="ts" x="391" y="200" text-anchor="middle">FPGA_RBF=core.rbf sdcard</text>
  <line class="ln" x1="516" y1="190" x2="540" y2="190"/>
  <rect class="file" x="548" y="158" width="188" height="64" rx="6"/>
  <text class="t" x="642" y="182" text-anchor="middle">bao.bin, boot.scr</text>
  <text class="ts" x="642" y="200" text-anchor="middle">SPL hex, ilc_demo.bin</text>
  <line class="ln" x1="736" y1="190" x2="752" y2="190"/>
  <rect class="out" x="760" y="158" width="176" height="64" rx="6"/>
  <text class="tw" x="848" y="182" text-anchor="middle">sdimage.img</text>
  <text class="tw" x="848" y="200" text-anchor="middle">FAT boot files</text>

  <text class="sub" x="24" y="250">QSPI Image</text>
  <rect class="file" x="24" y="262" width="210" height="52" rx="6"/>
  <text class="t" x="129" y="283" text-anchor="middle">SOF + SPL hex</text>
  <text class="ts" x="129" y="300" text-anchor="middle">baseline_a55.sof</text>
  <line class="ln" x1="234" y1="288" x2="258" y2="288"/>
  <rect class="step" x="266" y="262" width="140" height="52" rx="6"/>
  <text class="t" x="336" y="292" text-anchor="middle">quartus_pfg</text>
  <line class="ln" x1="406" y1="288" x2="430" y2="288"/>
  <rect class="out" x="438" y="262" width="200" height="52" rx="6"/>
  <text class="tw" x="538" y="292" text-anchor="middle">ghrd.hps.jic</text>

  <rect class="band" x="8" y="380" width="944" height="248" rx="8"/>
  <text class="label" x="24" y="402">Linux + FreeRTOS</text>
  <rect class="src" x="20" y="418" width="150" height="64" rx="6"/>
  <text class="t" x="95" y="442" text-anchor="middle">Full source set</text>
  <text class="ts" x="95" y="460" text-anchor="middle">Linux to Buildroot</text>
  <line class="ln" x1="170" y1="450" x2="186" y2="450"/>
  <rect class="step" x="194" y="418" width="156" height="64" rx="6"/>
  <text class="t" x="272" y="442" text-anchor="middle">BusyBox timeout</text>
  <text class="ts" x="272" y="460" text-anchor="middle">rpmsg script patch</text>
  <line class="ln" x1="350" y1="450" x2="366" y2="450"/>
  <rect class="step" x="374" y="418" width="236" height="64" rx="6"/>
  <text class="t" x="492" y="442" text-anchor="middle">make CONFIG=linux_freertos</text>
  <text class="ts" x="492" y="460" text-anchor="middle">FPGA_RBF=core.rbf sdcard</text>
  <line class="ln" x1="610" y1="450" x2="626" y2="450"/>
  <rect class="file" x="634" y="418" width="140" height="64" rx="6"/>
  <text class="t" x="704" y="442" text-anchor="middle">linux.bin</text>
  <text class="ts" x="704" y="460" text-anchor="middle">bao.bin, rootfs</text>
  <line class="ln" x1="774" y1="450" x2="790" y2="450"/>
  <rect class="out" x="798" y="418" width="142" height="64" rx="6"/>
  <text class="tw" x="869" y="442" text-anchor="middle">sdimage.img</text>
  <text class="tw" x="869" y="460" text-anchor="middle">FAT + ext4</text>

  <text class="sub" x="24" y="510">QSPI Image</text>
  <rect class="file" x="24" y="522" width="210" height="52" rx="6"/>
  <text class="t" x="129" y="543" text-anchor="middle">SOF + SPL hex</text>
  <text class="ts" x="129" y="560" text-anchor="middle">baseline_a55.sof</text>
  <line class="ln" x1="234" y1="548" x2="258" y2="548"/>
  <rect class="step" x="266" y="522" width="140" height="52" rx="6"/>
  <text class="t" x="336" y="552" text-anchor="middle">quartus_pfg</text>
  <line class="ln" x1="406" y1="548" x2="430" y2="548"/>
  <rect class="out" x="438" y="522" width="200" height="52" rx="6"/>
  <text class="tw" x="538" y="552" text-anchor="middle">ghrd.hps.jic</text>

  <rect class="src" x="24" y="652" width="18" height="18" rx="3"/>
  <text class="legend" x="48" y="666">Source</text>
  <rect class="step" x="120" y="652" width="18" height="18" rx="3"/>
  <text class="legend" x="144" y="666">Build step</text>
  <rect class="file" x="240" y="652" width="18" height="18" rx="3"/>
  <text class="legend" x="264" y="666">Intermediate file</text>
  <rect class="out" x="410" y="652" width="18" height="18" rx="3"/>
  <text class="legend" x="434" y="666">Programming image</text>
</svg>
